<line class="lifeline" data-actor="Approval" x1="1035.0895" y1="70" x2="1035.0895" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Provider" x1="1231.3045" y1="70" x2="1231.3045" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Sender" data-to="EmailWorker" data-label="Envoie un email" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="101.4385" y1="90" x2="300.6175" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="201.02800000000002" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Envoie un email</text>
