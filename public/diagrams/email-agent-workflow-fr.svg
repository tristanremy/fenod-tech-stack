  <text x="494.98" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Archive brute R2</text>
</g>
<g class="actor" data-id="Queue" data-label="Evenement Queue / D1" data-type="participant">
  <rect x="601.602" y="30" width="159.92" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="681.562" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Evenement Queue / D1</text>
</g>
