<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1231.2259999999999 470" width="1231.2259999999999" height="470" style="--bg:#ffffff;--fg:#0f172a;--line:#50d170;--accent:#6480ff;--surface:#f8fafc;--border:#6480ff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Sender" x1="93.2875" y1="70" x2="93.2875" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="EmailWorker" x1="284.3155" y1="70" x2="284.3155" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R2" x1="473.491" y1="70" x2="473.491" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Queue" x1="638.584" y1="70" x2="638.584" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Agent" x1="796.2669999999999" y1="70" x2="796.2669999999999" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Approval" x1="953.5794999999999" y1="70" x2="953.5794999999999" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Provider" x1="1129.0465" y1="70" x2="1129.0465" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Sender" data-to="EmailWorker" data-label="Send email" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="93.2875" y1="90" x2="284.3155" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="188.80149999999998" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Send email</text>
</g>
<g class="message" data-from="EmailWorker" data-to="EmailWorker" data-label="Validate sender, size, attachments" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="284.3155,130 314.3155,130 314.3155,150 284.3155,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="322.3155" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Validate sender, size, attachments</text>
</g>
<g class="message" data-from="EmailWorker" data-to="R2" data-label="Store raw copy when needed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="284.3155" y1="200" x2="473.491" y2="200" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="378.90324999999996" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Store raw copy when needed</text>
</g>
<g class="message" data-from="EmailWorker" data-to="Queue" data-label="Write normalized event" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="284.3155" y1="240" x2="638.584" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="461.44975" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Write normalized event</text>
</g>
<g class="message" data-from="Queue" data-to="Agent" data-label="Process structured task" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="638.584" y1="280" x2="796.2669999999999" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="717.4254999999999" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Process structured task</text>
</g>
<g class="message" data-from="Agent" data-to="Approval" data-label="Propose outbound response" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="796.2669999999999" y1="320" x2="953.5794999999999" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="874.9232499999999" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Propose outbound response</text>
</g>
<g class="message" data-from="Approval" data-to="Agent" data-label="Allow, reject, or require human review" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="953.5794999999999" y1="360" x2="796.2669999999999" y2="360" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="874.9232499999999" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Allow, reject, or require human review</text>
</g>
<g class="message" data-from="Agent" data-to="Provider" data-label="Send approved transactional email" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="796.2669999999999" y1="400" x2="1129.0465" y2="400" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="962.6567499999999" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Send approved transactional email</text>
</g>
<g class="actor" data-id="Sender" data-label="Inbound sender" data-type="participant">
  <rect x="30" y="30" width="126.57499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="93.2875" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Inbound sender</text>
</g>
<g class="actor" data-id="EmailWorker" data-label="Cloudflare Email Worker" data-type="participant">
  <rect x="196.575" y="30" width="175.481" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="284.3155" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Cloudflare Email Worker</text>
</g>
<g class="actor" data-id="R2" data-label="R2 raw archive" data-type="participant">
  <rect x="412.056" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="473.491" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">R2 raw archive</text>
</g>
<g class="actor" data-id="Queue" data-label="Queue / D1 event" data-type="participant">
  <rect x="574.9259999999999" y="30" width="127.316" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="638.584" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Queue / D1 event</text>
</g>
<g class="actor" data-id="Agent" data-label="App or agent" data-type="participant">
  <rect x="742.242" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="796.2669999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">App or agent</text>
</g>
<g class="actor" data-id="Approval" data-label="Approval policy" data-type="participant">
  <rect x="890.2919999999999" y="30" width="126.57499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="953.5794999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Approval policy</text>
</g>
<g class="actor" data-id="Provider" data-label="Resend / Postmark" data-type="participant">
  <rect x="1056.867" y="30" width="144.359" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="1129.0465" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Resend / Postmark</text>
</g>
</svg>