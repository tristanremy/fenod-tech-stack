</g>
<g class="node" data-id="Regression" data-label="Regression suite" data-shape="rectangle">
  <rect x="194.12900000000002" y="174.68999999999997" width="141.985" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
