  <rect x="570.703" y="174.68999999999997" width="162.73300000000003" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="652.0695" y="193.14" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent implementation</text>
