<g class="node" data-id="Review" data-label="Human or agent review" data-shape="rectangle">
  <rect x="360.11400000000003" y="115.93999999999997" width="174.589" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="447.4085" y="134.39" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Human or agent review</text>
</g>
<g class="node" data-id="Ship" data-label="Ship" data-shape="rectangle">
  <rect x="640.8100000000002" y="109.78999999999996" width="68.626" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="675.1230000000002" y="128.23999999999995" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Ship</text>
</g>
</svg>