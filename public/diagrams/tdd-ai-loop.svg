<polyline class="edge" data-from="Review" data-to="Ship" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="534.703,134.39 546.703,134.39 546.703,128.23999999999995 640.8100000000002,128.23999999999995" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Regression" data-to="Agent" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Fail" points="336.11400000000003,199.28999999999996 483.233,199.28999999999996 483.233,205.43999999999997 558.703,205.43999999999997 558.703,199.28999999999996 570.703,199.28999999999996" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
