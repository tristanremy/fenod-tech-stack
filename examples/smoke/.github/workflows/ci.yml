name: Local starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      DO_NOT_TRACK: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf-types && git diff --exit-code
      - run: pnpm ship
      - run: pnpm build && git diff --exit-code
      - run: pnpm audit --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e && git diff --exit-code
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      # Offline: no verification requests to credential providers.
      - name: Scan tracked content offline
        env:
          GITLEAKS_DIGEST_A: c00b6bd0aeb3071cbcb79009cb16a60d
          GITLEAKS_DIGEST_B: d9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          image="ghcr.io/gitleaks/gitleaks@sha256:${GITLEAKS_DIGEST_A}${GITLEAKS_DIGEST_B}"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" \
            dir --redact --no-banner --exit-code 1 /repo
