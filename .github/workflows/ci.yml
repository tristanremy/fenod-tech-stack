name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  secrets:
    name: Secrets scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout history for change scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked content offline
        env:
          GITLEAKS_DIGEST_A: c00b6bd0aeb3071cbcb79009cb16a60d
          GITLEAKS_DIGEST_B: d9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          image="ghcr.io/gitleaks/gitleaks@sha256:${GITLEAKS_DIGEST_A}${GITLEAKS_DIGEST_B}"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" \
            dir --redact --no-banner --exit-code 1 /repo

  docs:
    name: Docs checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent context
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  smoke:
    name: Smoke app ship gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/smoke/pnpm-lock.yaml

      - name: Install smoke dependencies
        run: pnpm install --frozen-lockfile

      - name: Ship gate
        run: pnpm ship

      - name: Verify deterministic Worker bindings and bundle
        run: |
          pnpm cf-types
          git diff --exit-code
          pnpm build
          git diff --exit-code

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  starter-export:
    name: Exported starter clean-room gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout exact revision without reusable credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Export and verify standalone application
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: node scripts/verify-starter.mjs "$GITHUB_SHA"

  astro:
    name: Astro static reference ship gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/astro
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/astro/pnpm-lock.yaml

      - name: Install Astro dependencies
        run: pnpm install --frozen-lockfile

      - name: Check templates, build both modes and test generated HTML
        run: pnpm ship

      - name: Audit dependencies
        run: pnpm audit --audit-level high
