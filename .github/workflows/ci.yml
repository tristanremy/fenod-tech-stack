name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history for change scan
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked content offline
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent context
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  smoke:
    name: Smoke app ship gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/smoke
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/smoke/pnpm-lock.yaml

      - name: Install smoke dependencies
        run: pnpm install --frozen-lockfile

      - name: Ship gate
        run: pnpm ship

      - name: Verify deterministic Worker bindings and bundle
        run: |
          pnpm cf-types
          git diff --exit-code
          pnpm build
          git diff --exit-code

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  starter-export:
    name: Exported starter clean-room gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout exact revision without reusable credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Export and verify standalone application
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: node scripts/verify-starter.mjs "$GITHUB_SHA"

  astro:
    name: Astro static reference ship gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/astro
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/astro/pnpm-lock.yaml

      - name: Install Astro dependencies
        run: pnpm install --frozen-lockfile

      - name: Check templates, build both modes and test generated HTML
        run: pnpm ship

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  astro:
    name: Astro static reference ship gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/astro
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/astro/pnpm-lock.yaml

      - name: Install Astro dependencies
        run: pnpm install --frozen-lockfile

      - name: Check templates, build both modes and test generated HTML
        run: pnpm ship

      - name: Audit dependencies
        run: pnpm audit --audit-level high
